name: Add New Talent

on:
  workflow_dispatch:
    inputs:
      # No default. "all" used to be pre-filled, one click from rebuilding every
      # talent from scratch. Existing talents are now skipped unless force is
      # ticked, but the rows should still be typed on purpose.
      rows:
        description: 'Rows to bootstrap (e.g. 74, 2-10, 2,5,74) — new talents only'
        required: true
      force:
        description: 'Rebuild talents that already have a file (wipes their history)'
        type: boolean
        default: false
      org:
        description: 'Which sheet the rows are from'
        type: choice
        options: [hololive, vspo]
        default: hololive

# The VSPO! roster: the published CSV of the VSPO! talent sheet. hololive's
# sheet stays in the CSV_URL secret. VSPO! data lives in vspo/, beside data/.
env:
  VSPO_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSgDaNfheUYWaSoid-ehW1RRHV1PwXq4rdU6SpYco9MPOrCQRyVQLR5hErxBWYH-fguz3iCMbYmo2kM/pub?gid=105975973&single=true&output=csv'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run bootstrap
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CSV_URL:    ${{ inputs.org == 'vspo' && env.VSPO_CSV_URL || secrets.CSV_URL }}
          ROWS:       ${{ github.event.inputs.rows }}
          FORCE:      ${{ github.event.inputs.force }}
          OUT_DIR:    ${{ inputs.org == 'vspo' && './vspo' || './data' }}
        run: node scripts/bootstrap.js

      - name: Commit updated data
        # Free text, so it reaches the shell as data, never as script.
        env:
          ROWS: ${{ github.event.inputs.rows }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          git add data/; [ -d vspo ] && git add vspo/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          MSG="bootstrap (${{ inputs.org }}): $ROWS"
          git commit -m "$MSG"
          # Another job may have pushed meanwhile. Its changes and ours are then
          # merged by content, video by video (scripts/merge-data.js), never as
          # lines of text: `git pull --rebase -X ours|theirs` used to drop one
          # half of a video that moved in the sorted list while another job
          # inserted one next to it, and the video vanished from the file.
          for i in $(seq 1 10); do
            git push && exit 0
            echo "push attempt $i rejected — merging onto latest main and retrying"
            sleep 10
            git fetch origin main || continue
            node scripts/merge-data.js "$BASE" || exit 1
            BASE=$(git rev-parse origin/main)
            git add data/; [ -d vspo ] && git add vspo/
            git diff --cached --quiet || git commit -m "$MSG"
          done
          echo "push failed after 10 attempts" >&2; exit 1
