name: Fetch View Counts

# Triggered externally by cron-job.org hitting the workflow_dispatch webhook.
# Also runnable manually from the GitHub Actions tab.
on:
  workflow_dispatch:
    inputs:
      popular_only:
        description: 'Rebuild popular.json only (skip fetching views)'
        type: boolean
        default: false

jobs:
  fetch-views:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch view counts
        if: ${{ inputs.popular_only != true }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          DATA_DIR:   ./data
        run: node scripts/fetch-views.js

      - name: Build popular rankings
        env:
          DATA_DIR: ./data
        run: node scripts/build-popular.js

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "views: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i rejected — rebasing onto latest main and retrying"; sleep 5
          done
          echo "push failed after 5 attempts" >&2; exit 1
