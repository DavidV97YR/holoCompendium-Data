name: Fetch View Counts

# Triggered externally by cron-job.org hitting the workflow_dispatch webhook.
# Also runnable manually from the GitHub Actions tab.
on:
  workflow_dispatch:
    inputs:
      popular_only:
        description: 'Rebuild popular.json only (skip fetching views)'
        type: boolean
        default: false

jobs:
  fetch-views:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Fetch view counts
        if: ${{ inputs.popular_only != true }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          DATA_DIR:   ./data
        run: node scripts/fetch-views.js

      - name: Build popular rankings
        env:
          DATA_DIR: ./data
        run: node scripts/build-popular.js

      - name: Build SQLite catalogue
        env:
          DATA_DIR: ./data
          OUT:      ./data.sqlite
        run: node scripts/build-sqlite.js

      # Uploaded over R2's S3-compatible API using the access key pair the R2
      # token page issues. Wrangler's `r2 object put` calls a REST endpoint that
      # dashboard-created R2 tokens are not authorised for (403), and the AWS
      # CLI is preinstalled on the runner, so this needs no Node and no npx.
      # Skipped until the secrets exist, so it cannot break the run before then.
      - name: Publish SQLite to R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          ACCOUNT_ID:            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws s3 cp ./data.sqlite "s3://holocompendium-db/data.sqlite" \
            --endpoint-url "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/vnd.sqlite3

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "views: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # -X ours: defer to whatever's already on origin on a genuine
          # conflict (e.g. a Full Recheck correction) rather than overwrite
          # it — view counts get refreshed again next run anyway. Also
          # prevents the rebase from ever getting stuck on an unresolved
          # conflict, which plain retries couldn't recover from.
          for i in $(seq 1 10); do
            git pull --rebase -X ours origin main && git push && exit 0
            echo "push attempt $i rejected — rebasing onto latest main and retrying"; sleep 10
          done
          echo "push failed after 10 attempts" >&2; exit 1
