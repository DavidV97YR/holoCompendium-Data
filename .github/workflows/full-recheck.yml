name: Full Recheck (Daily)

# Runs backfill mode against every channel. Triggered externally by
# cron-job.org hitting the workflow_dispatch webhook — same pattern as
# fetch-views.yml — rather than GitHub's native `schedule:` trigger, which
# is best-effort and can run late or get skipped entirely during high-load
# periods. Also runnable manually from the Actions tab.
#
# Uses YT_API_KEY_RECHECK (a second, separate YouTube Data API key/quota
# from the one Update Channel Data / Bootstrap use), so a bad day here
# can't eat into the quota the frequent update runs depend on.

on:
  workflow_dispatch:

jobs:
  full-recheck:
    runs-on: ubuntu-latest
    # A full recheck takes about 90 minutes; this only stops a stuck one.
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run full recheck (backfill mode, all channels)
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
          CSV_URL:         ${{ secrets.CSV_URL }}
          YT_API_KEY:      ${{ secrets.YT_API_KEY_RECHECK }}
          ROWS:            all
          BACKFILL:        'true'
          DATA_DIR:        ./data
        run: node scripts/update.js

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          MSG="full recheck: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "$MSG"
          # Another job may have pushed meanwhile. Its changes and ours are then
          # merged by content, video by video (scripts/merge-data.js), never as
          # lines of text: `git pull --rebase -X ours|theirs` used to drop one
          # half of a video that moved in the sorted list while another job
          # inserted one next to it, and the video vanished from the file.
          for i in $(seq 1 15); do
            git push && exit 0
            echo "push attempt $i rejected — merging onto latest main and retrying"
            sleep 15
            git fetch origin main || continue
            node scripts/merge-data.js "$BASE" || exit 1
            BASE=$(git rev-parse origin/main)
            git add data/
            git diff --cached --quiet || git commit -m "$MSG"
          done
          echo "push failed after 15 attempts" >&2; exit 1
