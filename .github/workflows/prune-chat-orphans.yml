name: Prune Chat Orphans (one-time)

# Removes chat data left behind for the streams the 2026-09-25 cleanup took out
# of the talent files (scripts/prune-chat-orphans.js says why). Run it once
# with dry_run on to see the list, then once with it off. Safe to delete this
# file and the script afterwards.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be removed without changing anything'
        type: boolean
        default: true

# Same group as Fetch Chat Data and Backfill Chat Data, so this never edits a
# {slug}-chat.json while one of them is writing it.
concurrency:
  group: chat-write
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Prune chat orphans
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/prune-chat-orphans.js

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/; [ -d vspo ] && git add vspo/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "prune chat data of removed private streams (one-time): $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in $(seq 1 15); do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i rejected — rebasing onto latest main and retrying"; sleep 15
          done
          echo "push failed after 15 attempts" >&2; exit 1
