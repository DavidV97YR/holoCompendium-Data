name: Test Community Posts (probe)

# THROWAWAY. Answers one question: can Actions runners reach YouTube's
# innertube browse endpoint, or do they get bot-challenged?
#
# Manual only — no cron, no schedule. Writes nothing and commits nothing,
# so it is safe to run at any time, including while other workflows are going.
# Delete this file and scripts/test-posts.js once it has answered.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Probe only the first N channels (0 = all)'
        required: false
        default: '10'
      delay_ms:
        description: 'Milliseconds between channels'
        required: false
        default: '2500'

jobs:
  probe:
    runs-on: ubuntu-latest
    # No `permissions: contents: write` — this job cannot modify the repo.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe innertube
        env:
          DATA_DIR: ./data
          LIMIT:    ${{ github.event.inputs.limit }}
          DELAY_MS: ${{ github.event.inputs.delay_ms }}
        run: node scripts/test-posts.js
