name: Update Channel Data

on:
  workflow_dispatch:
    inputs:
      rows:
        description: 'Rows to process (e.g. 74, 2-10, 2,5,74 or "all")'
        required: true
        default: 'all'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run updater
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
          CSV_URL:         ${{ secrets.CSV_URL }}
          YT_API_KEY:      ${{ secrets.YT_API_KEY }}
          ROWS:            ${{ github.event.inputs.rows }}
          DATA_DIR:        ./data
        run: node scripts/update.js

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" || \
          git commit -m "update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
